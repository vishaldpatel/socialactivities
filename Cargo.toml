[workspace]
resolver = "3"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
sdsa-core = { path = "crates/core" }
chrono = "0.4.45"
rrule = "0.14.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v4"] }
iced = { version = "0.14.0", features = ["image"] }
directories = "6.0.0"
open = "5"
